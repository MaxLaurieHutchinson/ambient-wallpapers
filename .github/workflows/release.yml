name: Tagged public release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'MaxLaurieHutchinson/ambient-wallpapers'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check owner sign-off prerequisites
        shell: bash
        run: |
          test -f LICENSE && test -f ASSETS-LICENSE.md || { echo "::error::Software and artwork licence notices are both required before release."; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::Tag must point to latest main commit."; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release tag must be vMAJOR.MINOR.PATCH."; exit 1; }
      - name: Run unit tests
        run: |
          python -m pip install Pillow
          python -m unittest discover -s skills/ambient-wallpapers/tests -v
      - name: Build and verify archives
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python tools/package_ambient_skill.py --version "$VERSION"
          python tools/verify_release.py
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/ambient-wallpapers-${VERSION}.zip" \
            "dist/ambient-wallpapers-showcase-${VERSION}.zip" \
            dist/ambient-wallpapers-manifest.json \
            --title "Ambient Wallpapers ${VERSION}" \
            --generate-notes \
            --verify-tag
