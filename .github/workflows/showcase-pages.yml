name: Publish showcase

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: showcase-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify distributables and showcase
        run: |
          python tools/package_ambient_skill.py
          python tools/verify_release.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public showcase
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Publish showcase
        id: deployment
        uses: actions/deploy-pages@v5
