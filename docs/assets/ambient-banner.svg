    <radialGradient id="glow"><stop offset="0" stop-color="#ad7144" stop-opacity=".38"/><stop offset="1" stop-color="#ad7144" stop-opacity="0"/></radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b3328"/><stop offset=".6" stop-color="#211f1b"/><stop offset="1" stop-color="#111210"/></linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#fff4df" stroke-opacity=".035" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="450" fill="url(#background)"/>
  <rect x="690" width="910" height="450" fill="url(#grid)"/>
  <ellipse cx="1270" cy="245" rx="485" ry="360" fill="url(#glow)"/>
  <path d="M0 449H1600" stroke="#73553c" stroke-opacity=".45"/>
