<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">Ambient Wallpapers</title>
  <desc id="desc">A graphite-and-amber wordmark reading Ambient Wallpapers, made to feel like yours, with a trio of abstract display outlines.</desc>
  <defs>
