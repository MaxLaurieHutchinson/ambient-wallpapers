  </g>
  <text x="90" y="224" font-family="Georgia,Palatino,serif" font-size="105" letter-spacing="-5" fill="#f3f0e8">Ambient</text>
  <text x="90" y="324" font-family="Georgia,Palatino,serif" font-size="105" letter-spacing="-5" fill="#e3a966">Wallpapers</text>
